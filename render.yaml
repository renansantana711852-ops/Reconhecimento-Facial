services:
  - type: web
    name: cadastro-facial
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    # 1 worker só: as sessões de cadastro ficam em memória (threads dão conta do recado)
    startCommand: gunicorn servidor:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SENHA_ACESSO
        sync: false   # você define no painel do Render
